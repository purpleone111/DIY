<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GCC DIY</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Abril+Fatface&family=UnifrakturCook:wght@700&family=Chewy&family=Permanent+Marker&family=Archivo+Black&family=Fraunces:wght@700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efece4;--pn:#fff;--tx:#1b1b1b;--mu:#6b6b6b;--ac:#0e90ab;--bd:#d8d4c8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121416;--pn:#1c1f22;--tx:#eee;--mu:#9a9a9a;--bd:#33373b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121416;--pn:#1c1f22;--tx:#eee;--mu:#9a9a9a;--bd:#33373b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
#app{display:grid;grid-template-columns:360px 1fr;height:100%}
#ctl{overflow:auto;padding:14px;background:var(--pn);border-right:1px solid var(--bd)}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;min-height:0}
#cv{max-width:100%;max-height:calc(100% - 56px);width:auto;height:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);background:#888}
h1{font-size:17px;margin:0 0 10px}h4{margin:14px 0 6px;font-size:12px;color:var(--mu);font-weight:600}
.ch{display:flex;flex-wrap:wrap;gap:5px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=text],select,textarea{width:100%;margin-bottom:5px}input[type=color]{padding:0;width:38px;height:28px}input[type=range]{width:100%;padding:0}
.sw{width:46px;height:28px;padding:0;border-radius:6px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:4px;margin:3px 0}.sel span{flex:1}.sel button{padding:1px 7px}
#bar{display:flex;gap:8px}#bar .big{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.8);overflow:auto;padding:20px;display:none}#ov.s{display:block}
.bx{max-width:900px;margin:auto;color:#fff}.bx img{max-width:100%;display:block;margin:6px 0 14px;background:#555}.bx a{color:#8fe}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}main{order:-1;padding:8px}#ctl{border-right:0;border-top:1px solid var(--bd)}}

#ctl{overflow:hidden;padding:0;display:flex;flex-direction:column;min-height:0}
#hd{padding:14px 16px 8px;border-bottom:1px solid var(--bd)}
#hd:before{content:"";display:block;height:7px;margin:-14px -16px 12px;background:linear-gradient(90deg,#ff3b30 0 25%,#ff9f1c 0 50%,#ffd23f 0 75%,#0e90ab 0)}
h1{font:400 22px/1 'Bowlby One',system-ui;margin:0 0 10px}
#pills{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.pl{white-space:nowrap;border-radius:99px;font-size:12px;padding:4px 10px 4px 5px;opacity:.7}
.pl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bd);margin-right:5px;font-size:11px}
.pl.on{opacity:1;background:var(--tx);color:var(--pn);border-color:var(--tx)}.pl.on b{background:#ffd23f;color:#111}.pl.dn b{background:#0e90ab;color:#fff}
#stp{flex:1;overflow:auto;padding:4px 16px 20px}
.step h2{font:400 28px/1.1 'Bowlby One',system-ui;margin:16px 0 2px}.hint{margin:0 0 4px;color:var(--mu)}
#nav{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--bd)}#nav button{flex:1;padding:12px;font-weight:700;border-radius:10px}
#nx2{background:linear-gradient(135deg,#ff3b30,#ff9f1c);border:0;color:#fff;font-size:15px}
main{background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 0) 0 0/22px 22px,linear-gradient(160deg,#10262c,#0b0c10)}
#cv{box-shadow:0 24px 70px rgba(0,0,0,.65);border-radius:3px}
.ch.fg{max-height:250px;overflow:auto;padding:2px}.fg button{font-size:17px;padding:6px 11px}
#lock{display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,#13a3c0,#0b5566 60%,#06232b)}
.lc{width:min(380px,100%);background:var(--pn);border-radius:18px;padding:26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lc img{width:170px}.lc h2{font:400 26px 'Bowlby One',system-ui;margin:4px 0 14px}.lc form{display:grid;gap:8px}.lc input{margin:0;padding:11px}
.lc .big{padding:12px;background:linear-gradient(135deg,#ff3b30,#ff9f1c);border:0;color:#fff;font-weight:700;border-radius:10px}#lm{color:var(--mu);min-height:1.4em}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script></head><body>
<div id="app"><aside id="ctl"><div id="hd"><h1>GCC DIY</h1><div id="pills"></div></div><div id="stp"></div><div id="nav"><button id="bk">◂ Back</button><button id="nx2">Next ▸</button></div></aside>
<main><canvas id="cv"></canvas><div id="bar"></div></main></div><div id="lock"><div class="lc"><img id="llg" alt="Goan Comedy Cartel"><h2>Team only</h2><form id="lf"><input id="le" type="email" placeholder="Email" autocomplete="username" required><input id="lw" type="password" placeholder="Password" autocomplete="current-password" required><button class="big">Sign in</button></form><p id="lm"></p></div></div><div id="ov"></div>
